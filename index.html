<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MakerHai</title>
  <meta property="og:title" content="MakerHai" />
  <meta property="og:description" content="Hi, I'm MakerHai — welcome to my corner of GitHub, where I build, tinker, and share what I'm working on." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sample-repo-pi-flame.vercel.app/" />
  <meta property="og:image" content="https://sample-repo-pi-flame.vercel.app/coral.jpg" />
  <meta property="og:image:width" content="1920" />
  <meta property="og:image:height" content="1280" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MakerHai" />
  <meta name="twitter:description" content="Hi, I'm MakerHai — welcome to my corner of GitHub, where I build, tinker, and share what I'm working on." />
  <meta name="twitter:image" content="https://sample-repo-pi-flame.vercel.app/coral.jpg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.05) 55%);
    }
    .caption {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      align-self: flex-end;
      margin-bottom: 4vh;
    }
    .caption h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 24px rgba(0,0,0,0.6);
    }
    .caption p {
      margin-top: 0.5rem;
      font-size: 1.125rem;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 12px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <section class="hero">
    <img src="coral.jpg" alt="Vibrant coral reef teeming with marine life" />
    <div class="caption">
      <h1>MakerHai</h1>
      <p>Hi, I'm MakerHai — I build, tinker, and share what's on my mind.</p>
    </div>
  </section>
</body>
</html>
