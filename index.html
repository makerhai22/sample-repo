<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sample-repo — MakerHai</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.05) 55%);
    }
    .caption {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      align-self: flex-end;
      margin-bottom: 4vh;
    }
    .caption h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 24px rgba(0,0,0,0.6);
    }
    .caption p {
      margin-top: 0.5rem;
      font-size: 1.125rem;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 12px rgba(0,0,0,0.6);
    }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 999px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <section class="hero">
    <img src="coral.jpg" alt="Vibrant coral reef teeming with marine life" />
    <div class="caption">
      <h1>sample-repo</h1>
      <p>Sample repository for MakerHai.</p>
      <div class="badge">Deployed on Vercel ▲</div>
    </div>
  </section>
</body>
</html>
